<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<style>
    body {
        background-image: url("mos.jpg");
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        background-attachment: fixed;
        margin: 0;
        font-family: Arial, sans-serif;
        color: #022C63;
    }

    .navbar {
        background-color: #9ccdff;
        padding: 15px 0;
        text-align: center;
        position: sticky;
        top: 0;
    }

    .navbar a {
        color: #022C63;
        text-decoration: none;
        font-weight: bold;
        margin: 0 15px;
        font-size: 14px;
    }

    .navbar a:hover {
        color: white;
    }

    h1 {
        text-align: center;
        margin-top: 30px;
    }

    .container {
        max-width: 600px;
        margin: 40px auto;
        background: rgba(255,255,255,0.6);
        padding: 20px;
        border: 1px solid #9ccdff;
    }

    .row {
        display: flex;
        justify-content: space-between;
        padding: 12px 0;
        border-bottom: 1px solid #9ccdff;
    }

    .row:last-child {
        border-bottom: none;
    }

    .label {
        font-weight: bold;
    }

    .value {
        font-size: 20px;
    }
</style>

</head>

<body>

<div class="navbar">
    <a href="index.html">Home</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="quiz.html">Quiz</a>
    <a href="laboratory.html">Lab</a>
    <a href="exam.html">Exam</a>
</div>

<h1>Dashboard</h1>

<div class="container">


<div class="row">
    <div class="label">Total Uploads</div>
    <div class="value" id="total">4</div>
</div>

<div class="row">
    <div class="label">Quiz Uploads</div>
    <div class="value" id="quiz">0</div>
</div>

<div class="row">
    <div class="label">Lab Uploads</div>
    <div class="value" id="lab">4</div>
</div>

<div class="row">
    <div class="label">Exam Uploads</div>
    <div class="value" id="exam">0</div>
</div>


</div>

</body>
</html>
