<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quiz</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #001b33, #002b4d);
        color: #d6ecff;
    }

    .navbar {
        background-color: #9ccdff;
        padding: 12px 0;
        text-align: center;
        position: sticky;
        top: 0;
    }

    .navbar a {
        color: #022C63;
        text-decoration: none;
        font-weight: bold;
        margin: 0 12px;
        font-size: 14px;
    }

    .navbar a:hover {
        color: white;
    }

    h1 {
        text-align: center;
        margin: 25px 0;
        color: #9ccdff;
    }

    
    .gallery {
        display: flex;
        flex-direction: column;
        gap: 25px;
        padding: 20px;
        max-width: 600px;
        margin: auto;
    }

    
    .card {
        display: block;
        text-decoration: none;
        color: inherit;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(156,205,255,0.25);
        border-radius: 12px;
        overflow: hidden;
        transition: all 0.25s ease;
    }

    
    .card:hover {
        transform: translateY(-6px) scale(1.02);
        border-color: rgba(156,205,255,0.8);
        box-shadow:
            0 0 15px rgba(156,205,255,0.35),
            0 10px 25px rgba(0,0,0,0.5);
    }

    .card img {
        width: 100%;
        height: 220px;
        object-fit: cover;
        display: block;
        transition: transform 0.3s ease, filter 0.3s ease;
    }

    .card:hover img {
        transform: scale(1.06);
        filter: brightness(1.1) saturate(1.2);
    }

    .card p {
        text-align: center;
        padding: 12px;
        margin: 0;
        font-weight: bold;
        background: rgba(0,0,0,0.25);
        color: #d6ecff;
    }

</style>
</head>

</div>
