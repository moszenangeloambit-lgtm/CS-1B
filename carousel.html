<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Carousel</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#d6efff;
    font-family:'Times New Roman', Times, serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
}

.card{
    max-width:700px;
    width:100%;
    background:#0b3c5d;
    border-radius:2rem;
    padding:2rem;
    box-shadow:0 15px 30px rgba(0, 60, 120, 0.4);
    text-align:center;
}

h2{
    color:#cce7ff;
    margin-bottom:1.8rem;
    font-size:2rem;
}

/* carousel */
.carousel{
    display:flex;
    overflow-x:auto;
    gap:1.2rem;
    scroll-snap-type:x mandatory;
    padding-bottom:1rem;
}

.carousel-item{
    scroll-snap-align:start;
    flex:0 0 auto;
    width:220px;
    height:150px;
    background:#1e6f9f;
    border-radius:1.5rem;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 8px 12px rgba(0,0,80,0.4);
    border:3px solid #cce7ff;
}

.carousel-item img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:1.4rem;
}

/* navigation */
.nav{
    margin-top:15px;
}

.nav a{
    text-decoration:none;
    background:#cce7ff;
    color:#0b3c5d;
    padding:6px 10px;
    border-radius:8px;
    margin:4px;
    font-size:14px;
    transition:0.3s;
}

.nav a:hover{
    background:#99d0ff;
}
</style>
</head>

<body>

<div class="card">
<h2> GREATEST GUITARISTS</h2>

<div class="carousel">

<div class="carousel-item" id="slide1">
<img src="images/bb.jpg">
</div>

<div class="carousel-item" id="slide2">
<img src="images/chuck.jpg">
</div>

<div class="carousel-item" id="slide3">
<img src="images/eric.jpg">
</div>

<div class="carousel-item" id="slide4">
<img src="images/images.jpg">
</div>

<div class="carousel-item" id="slide5">
<img src="images/jimi.jpg">
</div>

<div class="carousel-item" id="slide6">
<img src="images/stev.jpg">
</div>

</div>

<div class="nav">
<a href="#slide1"> 1</a>
<a href="#slide2"> 2</a>
<a href="#slide3"> 3</a>
<a href="#slide4"> 4</a>
<a href="#slide5"> 5</a>
<a href="#slide6"> 6</a>
</div>

</div>

</body>
</html>
